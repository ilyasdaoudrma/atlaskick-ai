name: Refresh stats snapshot

# Regenerates public/data/snapshot.json from the live sources and commits it.
#
# The 3-hourly schedule was removed on 2026-09-20: the 2026 World Cup finished
# on 2026-07-19, so every result, leaderboard and Elo rating in the snapshot is
# final and re-fetching them just re-requested unchanging data from ESPN.
# The job is kept for manual runs from the Actions tab — if a source is ever
# corrected, or the snapshot needs rebuilding, trigger it by hand.

on:
  workflow_dispatch: {} # manual runs only

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch fresh snapshot
        run: node scripts/fetch-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "atlaskick-bot"
          git config user.email "bot@atlaskick.local"
          git add public/data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh stats snapshot [skip ci]"
            git push
          fi
